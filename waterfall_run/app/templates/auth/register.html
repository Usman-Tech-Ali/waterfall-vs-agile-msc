{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="form-card auth-card">

    <div class="brand-mark">
      <div class="logo-icon">✦</div>
      <h1>Create Account</h1>
      <p>Join your team workspace</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus
               maxlength="80" placeholder="Choose a username">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required
               maxlength="120" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password <span style="color:var(--text-muted);font-weight:400;text-transform:none;letter-spacing:0;">(min 6 chars)</span></label>
        <input type="password" id="password" name="password" required
               minlength="6" placeholder="••••••••">
      </div>
      <div class="form-actions" style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
          Create Account
        </button>
      </div>
    </form>

    <p class="form-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </p>

  </div>
</div>
{% endblock %}
